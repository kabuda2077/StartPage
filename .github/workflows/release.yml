name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package extension
        run: |
          zip -r "StartPage-${{ github.ref_name }}.zip" . \
            -x "*.git*" \
            -x ".github/*" \
            -x "README.md" \
            -x "*.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: StartPage-${{ github.ref_name }}.zip
          generate_release_notes: true
