<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start Page</title>
  
  <link rel="stylesheet" href="style.css">
  
  <script src="script.js" defer></script>
</head>
<body>
  <div id="welcome-overlay">
    <div id="welcome-input-container">
      <div id="welcome-prompt">choose a name for you</div>
      <input type="text" id="welcome-name-input" placeholder="Press Enter to confirm" autocomplete="off" />
    </div>
    <div id="welcome-greeting-container">
      <div id="welcome-greeting-text"></div>
    </div>
  </div>

  <h1 id="greeting" class="reveal-target" style="--delay: 1;">Hello!</h1>
  <div class="datetime-weather-container reveal-target" style="--delay: 2;">
    <div id="weather" class="weather-display">
      <div class="temperature-info">
        <span id="weather-temp">--°C</span>
        <span id="weather-feels-like" class="weather-detail">--</span>
        <span id="weather-high-low" class="weather-detail">--</span>
      </div>
    </div>
  </div>

  <div class="search-box reveal-target" style="--delay: 3;">
    <form id="search-form">
      <div class="search-container">
        <div id="search-engine-selector" class="search-engine-selector">
          <span id="current-engine-icon" class="ui-icon engine-brand-icon"></span>
          <ul id="engine-list" class="engine-list"></ul>
        </div>
        <input id="search-input" type="text" name="q" placeholder="Search something..." autofocus autocomplete="off" />
      </div>
    </form>
  </div>

  <div class="groups reveal-target" style="--delay: 4;"></div>

  <div id="locationModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="loc-modal-title" tabindex="-1">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="loc-modal-title">输入您的位置</h2>
        <div class="header-actions">
          <button class="header-btn close-btn" id="loc-close-button" aria-label="Close">&times;</button>
        </div>
      </div>
      <div class="location-field">
        <input type="text" id="locationInput" class="standalone-input location-input" autocomplete="off" aria-autocomplete="list" aria-controls="locationSuggestions" aria-expanded="false" />
        <div id="locationSuggestions" class="location-suggestions" role="listbox"></div>
      </div>
      <div id="locationSelectionPreview" class="location-selection" hidden></div>
      <div class="location-actions">
        <button id="saveLocationBtn" class="btn btn-primary">保存位置</button>
        <button id="useCurrentLocationBtn" class="btn btn-secondary">使用当前位置</button>
      </div>
      <p id="locationError" class="location-error"></p>
    </div>
  </div>

  <div id="floating-controls" class="reveal-target" style="--delay: 5;">
    <div id="theme-toggle-icon" class="floating-btn" title="Toggle Dark Mode"></div>
    <div id="settings-icon" class="floating-btn" title="Settings">
      <span class="ui-icon" data-icon="cog"></span>
    </div>
  </div>

  <div id="settingsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title" tabindex="-1">
    <div class="modal-content modal-content-settings">
      <div class="modal-header">
        <h2 id="settings-title">设置</h2>
        <div class="header-actions">
          <button class="header-btn lang-btn" id="langToggleBtnSettings">EN</button>
          <button class="header-btn close-btn" id="settings-close-button" aria-label="Close">&times;</button>
        </div>
      </div>
      <div id="settings-groups-container"></div>
      
      <div id="settings-actions" class="settings-actions-section">
        <button id="addNewGroupBtn" class="btn btn-primary full-width">
          <span class="ui-icon" data-icon="plus"></span> <span id="addNewGroupBtnText">添加新分组</span>
        </button>
      </div>
      
      <div id="global-settings-section" class="settings-section">
        <button id="editEnginesBtn" class="btn btn-accent full-width">
          <span class="ui-icon" data-icon="search"></span> <span id="editEnginesBtnText">自定义搜索引擎</span>
        </button>

        <div id="username-section">
          <div class="setting-item setting-saved-row" id="username-saved-mode">
            <div class="setting-label-row">
              <span class="ui-icon setting-icon" data-icon="user"></span>
              <span id="username-saved-text" class="setting-saved-text"></span>
            </div>
            <button class="btn btn-icon" id="editUsernameBtn" title="编辑用户名" data-svg="edit"></button>
          </div>
          <div class="setting-item edit-height" id="username-edit-mode">
            <span class="ui-icon setting-icon" data-icon="user"></span>
            <input type="text" class="setting-input" id="usernameInput" placeholder="输入您的名字" autocomplete="off">
            <button class="btn btn-icon btn-success" id="saveUsernameBtn" data-svg="check"></button>
          </div>
        </div>

        <div id="api-key-section">
          <div class="setting-item setting-saved-row" id="api-key-saved-mode">
            <div class="setting-label-row">
              <span class="ui-icon setting-icon" data-icon="key"></span>
              <span id="api-key-saved-text" class="setting-saved-text"></span>
            </div>
            <button class="btn btn-icon" id="editApiKeyBtn" title="编辑 Key" data-svg="edit"></button>
          </div>
          <div class="setting-item edit-height" id="api-key-edit-mode">
            <span class="ui-icon setting-icon" data-icon="key"></span>
            <input type="text" class="setting-input" id="apiKeyInput" autocomplete="off">
            <button class="btn btn-icon btn-success" id="saveApiKeyBtn" data-svg="check"></button>
          </div>
          <p id="applyApiKeyText" class="api-key-help"></p>
        </div>
      </div>
    </div>
  </div>

  <div id="customConfirmModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="customConfirmMessage" tabindex="-1">
      <div class="modal-content modal-content-confirm">
          <p id="customConfirmMessage" class="confirm-message"></p>
          <div class="confirm-actions">
              <button class="btn btn-confirm-danger" id="confirm-yes">是</button>
              <button class="btn btn-secondary" id="confirm-no">否</button>
          </div>
      </div>
  </div>
</body>
</html>
